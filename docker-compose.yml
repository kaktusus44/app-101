services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app101
      POSTGRES_USER: app101
      POSTGRES_PASSWORD: app101
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app101 -d app101"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app101:app101@db:5432/app101?sslmode=disable
      HTTP_ADDR: :8080
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
