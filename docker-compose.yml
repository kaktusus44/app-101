services:
  db:
    image: postgres:17-alpine
    network_mode: host
    environment:
      POSTGRES_DB: app101
      POSTGRES_USER: app101
      POSTGRES_PASSWORD: app101
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app101 -d app101"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./backend
      network: host
    network_mode: host
    environment:
      DATABASE_URL: postgres://app101:app101@127.0.0.1:5432/app101?sslmode=disable&connect_timeout=5
      HTTP_ADDR: :18080
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      network: host
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
